spring.application.name=EventLime
server.port=8080

# Local MongoDB connection (fallback)
spring.data.mongodb.uri=mongodb://localhost:27017/eventlime
spring.data.mongodb.database=eventlime

# File upload configuration
file.upload-dir=../my-react-app/public/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.session.timeout=60m
